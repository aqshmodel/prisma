name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: isolated-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Configure public browser build values
        env:
          PUBLIC_BUILD_ENV: ${{ vars.PUBLIC_BUILD_ENV_JSON }}
        run: python3 scripts/secure-release/public_build.py
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit && npm test -- --run
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: python3 scripts/secure-release/prepare_next.py . stage/web
      - name: Package release
        id: package
        run: python3 scripts/secure-release/package_release.py --app prisma --repository aqshmodel/prisma --component web=stage/web --lockfile package-lock.json=package-lock.json --output release.tar.gz
      - name: Submit verified release through scoped SSH
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.ISOLATED_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.ISOLATED_DEPLOY_KNOWN_HOSTS }}
          RELEASE: ${{ steps.package.outputs.release }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/isolated_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/isolated_key release.tar.gz' EXIT
          ssh -T -i ~/.ssh/isolated_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ConnectTimeout=20 aqsh-deploy-prisma@162.43.31.17 "submit $RELEASE $SHA256" < release.tar.gz
